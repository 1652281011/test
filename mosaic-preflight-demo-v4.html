const samplePars=[{"id": "abstract-purpose", "section": "摘要 · 研究目的", "original": "目的：考察高校青年睡眠质量与焦虑症状的关联，并探索在控制人口学特征和近期压力后，该关联是否仍然存在。青年阶段的生活节律与角色要求变化较大，了解睡眠和焦虑的共同变化，有助于提出更具体的后续研究问题。"}, {"id": "abstract-method", "section": "摘要 · 方法与结果", "original": "方法：通过校园招募获得218名参与者，最终纳入201名进行分析。使用在线问卷收集睡眠质量、焦虑症状、近期压力和生活习惯，采用描述性统计、相关分析及多元线性回归。结果：睡眠质量得分与焦虑评分呈负相关（r = −0.42，p < .01）；调整年龄、性别和近期压力后，关联方向保持一致。"}, {"id": "causal-0", "section": "摘要 · 结论", "original": "改善睡眠可降低青年人的焦虑症状。研究结果提示，睡眠是青年心理健康支持中值得关注的因素。后续工作需要扩大样本来源，结合连续测量进一步澄清睡眠与焦虑之间的时间关系，并比较不同生活情境下关联的稳定性。", "gid": "causal", "li": 0}, {"id": "keywords", "section": "关键词", "original": "睡眠质量；焦虑症状；青年；横断面调查；自我报告。"}, {"id": "intro", "section": "1 引言 · 研究背景", "original": "青年阶段通常伴随学习任务、职业选择和社会关系的变化。部分青年会经历就寝时间推迟、睡眠节律不稳定或主观睡眠恢复不足，同时也可能报告紧张、担忧和注意力难以集中等体验。睡眠和焦虑可能通过多个途径相互关联：生活压力可能同时影响两者，情绪困扰也可能改变个体对自身睡眠状况的评价。因此，需要结合具体测量方式和研究情境考察二者的关系。"}, {"id": "intro-literature", "section": "1 引言 · 文献线索", "original": "关于睡眠与情绪的讨论常涉及生理唤醒、反复思考和日间功能受损等过程。不同研究采用的样本、工具及时间窗口并不完全相同：部分研究使用日记方式记录日常变化，部分研究依靠一次性自评问卷，也有研究关注临床人群。样本和测量层面的差异可能影响结果的可比性，因此有必要明确每项研究实际测量了什么，以及所得结果主要适用于何种人群。"}, {"id": "intro-gap", "section": "1 引言 · 研究问题", "original": "高校青年在住宿条件、学习节奏和日常安排方面具有相对集中的生活情境，同时也存在年级、学业任务和压力体验上的个体差异。本研究关注两个问题：第一，睡眠质量与焦虑症状在当前样本中是否相关；第二，在调整人口学特征和近期压力后，该关联是否仍可观察到。通过描述这些关系，研究希望为后续测量设计和问题选择提供线索。"}, {"id": "design", "section": "2.1 方法 · 研究设计", "original": "本研究采用横断面在线问卷设计，在同一调查时点收集睡眠与焦虑相关信息。参与者通过校园公告和学生组织转发的链接进入问卷，阅读研究说明后自行决定是否参加。数据收集持续两周，参与者按自己的时间完成问卷，未接受研究者安排的睡眠干预。调查页面按照人口学信息、睡眠体验、焦虑症状和生活习惯的顺序呈现，各部分均以自我报告方式完成。"}, {"id": "sample-0", "section": "2.2 方法 · 研究对象", "original": "本研究招募了218名青年参与者。招募说明面向18至29岁的在校学生，参与者需要能独立阅读问卷并完成自评。研究使用便利抽样，未按院系、年级或住宿方式设置分层配额。问卷链接由校园公共渠道传播，研究者没有单独向特定年级定向邀请。参与者在提交后不再接受后续联系，招募期间未提供与完成问卷有关的报酬。", "gid": "sample", "li": 0}, {"id": "sample-2", "section": "2.2 方法 · 样本流程", "original": "最终纳入201名参与者进行分析。问卷提交后进行基础整理，检查记录是否能够用于主要变量分析，并将符合分析条件的记录合并为最终数据集。整理过程由同一名研究人员完成，分析文件使用编号代替个人标识。样本流转情况与主要变量分布分别在结果部分和表1中报告。", "gid": "sample", "li": 2}, {"id": "sample-description", "section": "2.2 方法 · 样本特征", "original": "分析样本的年龄均值为22.4岁（标准差2.6），其中119人自报为女性，80人为男性，2人选择其他或不愿说明。143人居住在校内宿舍，58人居住在校外。参与者来自不同年级，各年级比例并不相同；低年级本科生与高年级及研究生面临的日常安排也存在差异。居住方式作为背景信息收集，用于描述样本生活情境。"}, {"id": "scale-0", "section": "2.3 方法 · 睡眠质量测量", "original": "使用睡眠质量量表评估睡眠。量表覆盖入睡体验、夜间睡眠连续性及醒来后的恢复感等内容，参与者根据过去一个月的主观体验作答。各项评分汇总后转换为0至100分，高分表示主观睡眠质量较好。研究使用总分进入主要分析，未对不同维度分别建模。问卷呈现顺序在所有参与者之间保持一致，作答页面不展示即时评分反馈。", "gid": "scale", "li": 0}, {"id": "anxiety-measure", "section": "2.3 方法 · 焦虑症状与其他变量", "original": "焦虑症状使用连续评分表示，范围为0至21分，高分表示自报症状较多。研究以总分反映症状水平，不根据本次调查作出临床诊断。近期压力采用0至10分的单项评分，同时收集过去一周的运动次数、睡前使用电子设备的时长和日均咖啡因饮品数量。相关问题均在同一份问卷中呈现，参与者依据各题指定的时间窗口回答。"}, {"id": "ethics-0", "section": "2.4 方法 · 研究程序与知情同意", "original": "参与者在研究前提供知情同意。问卷首页介绍了研究主题、参与方式、预计作答时长和自愿参加原则，参与者勾选同意后进入正式问卷。个人可以在提交前退出页面，不需要说明原因。研究不收集姓名、学号或联系方式，整理后的数据仅以汇总方式呈现，研究团队不尝试将问卷答案与特定个人重新关联。", "gid": "ethics", "li": 0}, {"id": "analysis-plan", "section": "2.5 方法 · 统计分析", "original": "先描述样本和主要变量的分布，再绘制散点图并计算Pearson相关系数。多元线性回归以焦虑评分为因变量，分别报告未调整模型、人口学调整模型及进一步纳入近期压力的模型。纳入变量的选择结合研究问题与问卷信息进行，睡眠得分始终作为连续变量处理。不同模型间的系数变化用于描述在给定测量因素下关联的变化。"}, {"id": "missing-0", "section": "2.5 方法 · 缺失数据处理", "original": "完整数据用于最终分析。数据文件整理后先检查主要变量的取值范围和分布，对明显不在设定范围内的数值返回问卷记录核对。分析保留变量的原始计分单位，未对睡眠得分或焦虑得分进行标准化。描述性统计和回归结果分别整理为表格，人口学变量的分类信息以人数和比例报告。", "gid": "missing", "li": 0}, {"id": "analysis-checks", "section": "2.5 方法 · 模型检查与探索性分析", "original": "模型分析前检查主要连续变量的分布，并在拟合后查看残差和异常观测情况。睡前设备使用和运动频次另作探索性比较，以了解生活习惯与主要变量的共同变化。上述分析不作为独立的主要假设检验，其结果与主要模型分开呈现。统计分析使用双侧检验，显著性水平设定为.05。"}, {"id": "missing-1", "section": "3.1 结果 · 样本与数据完整性", "original": "最终分析纳入201人。年龄、居住方式、睡眠得分和焦虑得分的描述性统计见表1。主要连续变量在样本中呈现一定离散程度，睡眠质量和焦虑症状均没有集中在单一分值。对不同年级和居住方式的描述用于呈现样本背景，不将其解释为总体人群的代表性估计。", "gid": "missing", "li": 1}, {"id": "table1", "section": "表1 · 样本与主要变量", "original": "样本人数：201；年龄：22.4 ± 2.6岁；睡眠质量得分：61.8 ± 14.7；焦虑评分：7.6 ± 4.3；近期压力：5.1 ± 2.0。校内居住143人，校外居住58人。女性119人，男性80人，其他或不愿说明2人。连续变量以均值与标准差表示，分类变量以人数表示。"}, {"id": "results", "section": "3.2 结果 · 主要相关分析", "original": "睡眠质量与焦虑评分呈显著负相关（r = −0.42，p < .01）。按照本研究的计分方式，睡眠得分越高表示睡眠质量越好，因此较高的睡眠得分与较低的焦虑评分同时出现。散点图显示两项得分之间存在总体负向趋势，但具有相同或相近睡眠得分的参与者，其焦虑评分仍有较大个体差异。"}, {"id": "stats-0", "section": "3.2 结果 · 探索性组间比较", "original": "组间差异具有统计学意义（p < .05）。探索性比较将睡眠得分按样本内分位点划分为三组，睡眠得分较高的一组报告了较低的平均焦虑水平。分组分析旨在补充展示连续变量关系，不替代相关分析和回归结果。不同组别的日常安排和压力体验也可能存在差异。", "gid": "stats", "li": 0}, {"id": "stats-1", "section": "3.3 结果 · 多元回归", "original": "模型结果显著。在加入年龄、性别和近期压力后，睡眠质量得分的回归系数为−0.09。与未调整模型相比，睡眠得分系数的绝对值减小，但方向保持一致。近期压力在模型中与较高的焦虑得分相关，提示参与者的生活压力与主要变量的关联需要结合考虑。", "gid": "stats", "li": 1}, {"id": "appendix-0", "section": "3.4 结果 · 敏感性分析的材料位置", "original": "详细结果见附表S2。探索性模型在主要调整变量的基础上加入运动频次和睡前设备使用时长，睡眠质量与焦虑评分之间的关联方向保持一致。相关结果作为补充信息呈现，用于帮助了解模型选择变化下估计值的稳定性，不将追加变量后的模型视为已经排除了全部可能解释。", "gid": "appendix", "li": 0}, {"id": "table2", "section": "表2 · 回归结果摘要", "original": "未调整模型中，睡眠质量得分的系数为−0.12；加入人口学变量后为−0.10；进一步加入近期压力后为−0.09。模型依次扩展，以便比较在不同调整条件下的结果。各模型均以焦虑总分作为因变量，睡眠质量总分作为主要解释变量。"}, {"id": "stats-2", "section": "表2 · 表下注释", "original": "* p < .05。模型1为未调整模型；模型2加入年龄和性别；模型3进一步加入近期压力。表中列出睡眠质量得分对应的回归系数，其余变量的结果在补充分析中呈现。", "gid": "stats", "li": 2}, {"id": "discussion-main", "section": "4.1 讨论 · 主要发现", "original": "本研究在高校青年样本中观察到，较好的主观睡眠与较少的焦虑症状相关。在调整年龄、性别和近期压力后，关联方向保持一致。结果说明睡眠和焦虑在这一生活情境中具有值得进一步考察的联系，但焦虑症状还与其他因素相关，不能只根据睡眠评分理解个体的心理健康状况。"}, {"id": "reference-0", "section": "4.1 讨论 · 与既有研究对照", "original": "与Zhang等（2021）的结果一致。本研究同样使用自我报告方式收集睡眠和情绪体验，观察到较好的睡眠与较少的症状同时出现。不过，不同样本的年龄范围、生活情境和问卷时间窗口可能影响关联强度，因此研究间的比较应结合各自设计理解，不能只根据统计显著性判断结果是否相同。", "gid": "reference", "li": 0}, {"id": "causal-1", "section": "4.2 讨论 · 解释与推断范围", "original": "本研究证明睡眠质量改善能够减少焦虑。睡眠得分在不同调整模型中呈现稳定的负向系数，说明睡眠与情绪之间的联系不能完全由已纳入的年龄、性别和近期压力解释。值得注意的是，未测量的个体差异与生活事件仍可能与两项变量有关，研究也没有对睡眠和焦虑的先后变化进行追踪。", "gid": "causal", "li": 1}, {"id": "discussion-mechanism", "section": "4.2 讨论 · 可能机制", "original": "一种可能的解释是，较差的睡眠恢复感与日间疲劳、注意控制困难或反复思考同时出现，从而形成更高的主观负担。另一种解释是，较高的焦虑水平影响入睡体验和睡眠评价。上述过程可以并存，也可能受到环境和个体因素的共同影响。由于本研究没有独立测量这些过程，相关解释仍需进一步研究。"}, {"id": "causal-3", "section": "4.3 讨论 · 实践意义", "original": "因此，针对睡眠的干预将减轻焦虑。高校支持服务可考虑将睡眠体验纳入常规交流，了解学生的生活节律、主观恢复感和近期压力。对于报告持续困扰的学生，还需要结合其他信息理解其需求，不能仅根据一次问卷给出单一解释。具体支持措施应结合服务情境与专业判断确定。", "gid": "causal", "li": 3}, {"id": "discussion-limit1", "section": "4.4 讨论 · 抽样与测量局限", "original": "本研究存在若干局限。首先，样本来自单一高校并通过便利方式招募，愿意参与问卷者可能与未参与者不同，各年级和生活情境的分布也不均衡。其次，主要变量均由同一参与者在同一问卷中自报，可能受到回忆误差、当时情绪和社会期许影响。不同变量的时间窗口也不完全一致，这些因素可能影响观察到的关联。"}, {"id": "discussion-limit2", "section": "4.4 讨论 · 设计与分析局限", "original": "再次，横断面设计无法确定时间先后关系，不能排除焦虑对睡眠的反向影响。模型只纳入有限协变量，尚有其他未测量因素可能共同影响睡眠和情绪。探索性分组和追加模型的结果也需要谨慎解释，不能因部分分析达到显著水平，就将其视为独立验证或直接应用的依据。"}, {"id": "discussion-future", "section": "4.5 讨论 · 后续研究", "original": "后续研究可以使用多时点测量，观察个体睡眠和焦虑在连续时间内的变化，并比较自我报告与其他测量方式提供的信息。在进一步研究实践措施前，应明确希望回答的问题、适用人群和结果指标。扩大样本来源、记录生活情境的变化，以及预先说明主要分析策略，有助于更清楚地界定结论的范围。"}, {"id": "causal-2", "section": "5 结论", "original": "睡眠改善是降低焦虑的有效途径。本研究发现，高校青年样本中的睡眠质量与焦虑评分呈负相关，在调整部分人口学特征和近期压力后，关联方向保持一致。睡眠体验值得在后续青年健康研究中受到关注，同时仍需更充分的设计澄清其与情绪症状之间的时间关系和潜在作用过程。", "gid": "causal", "li": 2}, {"id": "statements", "section": "声明 · 数据、资助与利益冲突", "original": "本研究获得所在机构伦理委员会批准，审批信息在独立伦理声明中列示。研究数据由研究团队保管，数据使用安排以适用的参与者同意范围与机构要求为准。研究未接受商业机构资助，作者声明不存在与本文相关的商业利益。研究设计、数据整理和论文撰写由研究团队共同完成，最终稿经全体作者确认。"}, {"id": "reference-1", "section": "参考文献 · 占位条目1", "original": "Zhang, A., & Lin, B. (2020). Sleep and anxiety in young adults. [虚构文献占位条目，无对应出版物。]", "gid": "reference", "li": 1}, {"id": "ref2", "section": "参考文献 · 占位条目2", "original": "Chen, C., & Wu, D. (2022). Daily routines and subjective well-being. [虚构文献占位条目，无对应出版物。]"}, {"id": "sample-1", "section": "补充材料A · 招募与筛选说明", "original": "参与者通过校园招募获得。招募公告说明了研究主题、作答时长和自愿参与原则，问卷链接在两周内开放。参与者进入后先阅读说明，再依次完成各部分问题。问卷提交后由研究人员统一整理，分析文件使用编号区分记录，不包含姓名、学号或联系方式。", "gid": "sample", "li": 1}, {"id": "scale-1", "section": "补充材料B · 量表展示示例", "original": "请根据过去一个月的情况回答。问卷涉及入睡体验、夜间连续睡眠、醒来后的恢复感和日间精神状态等方面。项目得分经汇总和转换后得到睡眠质量总分，高分表示主观睡眠质量较好。研究以总分参与统计分析，不根据单个项目对参与者进行分类，也不把评分结果反馈为个人诊断。", "gid": "scale", "li": 1}, {"id": "supp-analysis", "section": "补充材料C · 附表S1说明", "original": "附表S1呈现在基础调整模型中进一步加入生活习惯变量后的结果。运动频次和睡前设备使用时长按问卷中的原始单位进入分析，睡眠得分系数保持负向。追加模型用于描述结果对部分模型选择的敏感程度，不替代主要分析；其解释需要与问卷测量时间窗口和样本特征共同考虑。"}];

ame.split('.').pop().toLowerCase();if(!['docx','txt'].includes(ext)){$('#importError').textContent='请选择 DOCX 或 TXT，PDF 和旧版 DOC 暂不支持。';return}if(file.size>8*1024*1024){$('#importError').textContent='文件超过本原型的 8 MB 限制，请选择较小文件。';return}$('#importPreview').innerHTML='<div class="busy"><span class="spinner" aria-hidden="true"></span><span>正在读取本机文字…</span></div>';$('#importFile').disabled=true;try{lastImportIssues=[];const texts=ext==='txt'?(await file.text()).split(/\r?\n/).filter(t=>t.trim()):await docxParagraphs(await file.arrayBuffer());if(!texts.length)throw Error('没有可编辑的文字；扫描件或纯图片稿件暂不支持。');if(texts.length>2000||texts.join('').length>400000)throw Error('内容超过演示范围，请选择更短的稿件（最多 2000 段、40 万字）。');if(token!==modalToken)return;pending={file,texts};const chunks=[{label:'开头',text:texts.slice(0,2).join('\n')},{label:'中间',text:texts[Math.floor(texts.length/2)]},{label:'末尾',text:texts[texts.length-1]}];$('#importPreview').innerHTML='<div class="summary-line">已提取 '+texts.length+' 段文字。请检查文字是否完整。</div>'+chunks.map(c=>'<details><summary>'+c.label+'预览</summary><p class="text-preview">'+esc(c.text.slice(0,700))+'</p></details>').join('')+(lastImportIssues.length?'<div class="hint">文档包含：'+esc(lastImportIssues.join('、'))+'。这些结构不能按原样保留。</div>':'')+(texts.some(t=>t.includes('\uFFFD'))?'<p class="error">部分文字可能编码异常，请先转为 UTF-8 TXT 后重试。</p>':'')+'<small>导入后仍需对照原文件检查完整性。没有生成检测结果。</small>';$('#openImported').disabled=!$('#importAcknowledged').checked}catch(err){if(token===modalToken){$('#importPreview').innerHTML='';$('#importError').textContent=(err instanceof RangeError||err instanceof TypeError?'文件结构无法解析，请另存为 DOCX 或 UTF-8 TXT 后重试。':err.message)||'读取失败，请尝试 TXT 格式。'}}finally{if(token===modalToken)$('#importFile').disabled=false}};$('#openImported').onclick=()=>{if(!pending||!$('#importAcknowledged').checked)return;const relation=$('#importRelation').value,parentId=relation==='version'?state.current:null;const id='doc-'+Date.now();state.docs[id]={title:pending.file.name.replace(/\.[^.]+$/,''),name:pending.file.name,sample:false,parentId,versionNote:parentId?'独立保存的新版本，未继承旧记录':'独立稿件',paragraphs:pending.texts.map((text,i)=>({id:'p'+i,section:'第 '+(i+1)+' 段',text,original:text})),questions:{},last:'p0'};closeModal();switchDoc(id);toast('文字已导入，可直接编辑。尚未运行检测。')}}

function exportModal(){persist();const d=activeDoc(),changes=changed(),qs=Object.keys(d.questions).length;openModal('导出','<div class="summary-line">'+changes.length+' 处文字修改 · '+activeDoc().paragraphs.filter(kept).length+' 处核对保留 · '+qs+' 个待确认事项 · '+(d.sample?'原始提示未经过工具复检':'尚未运行检测')+'</div><p style="margin-top:14px">导出不要求处理完所有提示。请确认文件能力与未确认事项后，选择需要的内容。</p><div class="option export-first"><h3>修改对照清单 .html</h3><p>包含原文定位、修改前后文字。适合将少量修改带回正式 Word 稿，保留原稿格式。</p><button class="primary" id="downloadChanges">下载修改对照</button><p style="margin:10px 0 0">回到原稿 → 按原文片段定位 → 逐项应用修改 → 核对公式、引用和上下文。此步骤仍需你完成。</p></div><div class="option"><h3>简化文字稿 .docx（另选）</h3><p>包含标题和当前全部正文。使用基础段落格式，不保留原稿排版、图片、公式、脚注、引用域或 Word 修订痕迹。不能视为可直接投稿的文件。</p><button id="downloadDocx">导出文字修订稿</button> <button id="downloadTxt">导出纯文字 TXT</button></div><details '+(changes.length?'open':'')+'><summary>查看 '+changes.length+' 处修改</summary><div>'+changes.map(p=>'<div class="change-item"><strong>'+esc(p.section)+'</strong><div class="diff">'+diffText(p.original,p.text)+'</div></div>').join('')+(changes.length?'':'<p>尚未修改。导出将保留当前文字。</p>')+'</div></details>'+(qs?'<p>待确认事项不包含在论文中，可单独打开并导出。</p><button id="exportQuestions">查看待确认事项</button>':'')+'<p class="error" id="exportError" role="status"></p>');const base=d.title.replace(/[\\/:*?"<>|]/g,'_').slice(0,80)||'稿件';$('#downloadTxt').onclick=()=>{download(d.title+'\n\n'+d.paragraphs.map(p=>p.text).join('\n\n'),base+'-文字修订稿.txt','text/plain;charset=utf-8');toast('已发起 TXT 下载。')};$('#downloadDocx').onclick=async()=>{const button=$('#downloadDocx');button.disabled=true;button.textContent='正在生成…';try{await new Promise(r=>requestAnimationFrame(r));download(docxBytes(),base+'-文字修订稿.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document');toast('已发起 DOCX 下载，请核对内容与格式。')}catch{$('#exportError').textContent='生成失败，修改仍已保留。请尝试导出 TXT。'}finally{button.disabled=false;button.textContent='导出文字修订稿'}};$('#downloadChanges').onclick=()=>{download('<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>修改对照</title><style>body{font:16px/1.8 sans-serif;max-width:850px;padding:30px;margin:auto}section{border-bottom:1px solid #ccc;padding:18px 0}del{background:#fbe7e4}ins{background:#dcefe3;text-decoration:none}p{white-space:pre-wrap}</style><h1>'+esc(d.title)+'：修改对照</h1><p>仅记录文字变化，不代表经过检测复核。'+qs+' 个待确认事项需另外导出。</p>'+changes.map(p=>'<section><h2>'+esc(p.section)+'</h2><h3>定位原文</h3><p>'+esc(p.original)+'</p><h3>修改对照</h3><p>'+diffText(p.original,p.text)+'</p><h3>当前修订文字</h3><p>'+esc(p.text)+'</p></section>').join('')+'</html>',base+'-修改对照.html','text/html;charset=utf-8');toast('已发起修改对照下载。')};if($('#exportQuestions'))$('#exportQuestions').onclick=discussion}
$('#export').onclick=exportModal;
const returning=Object.values(state.docs).some(d=>d.paragraphs.some(p=>p.text!==p.original||kept(p))||Object.keys(d.questions||{}).length||d.resumeId);render();if(recoveryRaw!==null){openModal('旧记录暂时无法读取','<p>原始本机记录没有被覆盖。你仍可体验示例，但新编辑只能暂存本次页面；建议先下载异常记录备份。</p><div class="modal-foot"><button id="backupUnreadable">下载原始记录备份</button><button class="primary" id="useSessionOnly">仅在本次页面继续</button></div>');$('#backupUnreadable').onclick=()=>download(recoveryRaw,'Mosaic-原始记录备份.json','application/json');$('#useSessionOnly').onclick=closeModal;}if(returning){$('#restoreText').textContent='已恢复《'+activeDoc().title+'》 · 上次：'+(pby(activeDoc().last)?.section||'论文正文');$('#continueWork').textContent=activeDoc().resumeId?'继续核对':'上次位置';$('#resumeBanner').hidden=false}if(!storageOK)$('#saveState').textContent='无法读取本机记录，请导出备份';requestAnimationFrame(()=>{const p=pby(active);if(p)navigate(active)});
